{% extends "base.html" %}
{% block head %}
<style>
.q-block{background:#f8f9ff;border:1px solid #e2e5f0;border-radius:12px;padding:18px;margin-bottom:14px}
</style>
{% endblock %}
{% block nav %}
  <a href="{% if session.get('role')=='admin' %}/admin{% else %}/company{% endif %}" style="color:var(--muted);text-decoration:none;padding:7px 14px;border-radius:8px;font-size:0.875rem;"><i class="fa-solid fa-arrow-left" style="margin-right:4px;"></i>Back</a>
  <a href="/logout" class="btn-nav"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
{% endblock %}
{% block content %}
<div style="max-width:820px;margin:0 auto;">
  <h1 class="page-title"><i class="fa-solid fa-clipboard-question" style="color:#4f46e5;margin-right:8px;"></i>Create Skill Assessment</h1>
  <p class="page-sub">Build a timed MCQ test for candidates. They must pass before being shortlisted.</p>
  <div class="card">
    <form action="/assessment/create" method="POST" id="aform">
      <div class="g2">
        <div class="form-group">
          <label>Select Drive</label>
          <select name="drive_id" class="form-control" required>
            <option value="">— Choose drive —</option>
            {% for d in drives %}
            <option value="{{ d.id }}">{{ d.title }}{% if d['company_name'] is defined and d['company_name'] %} ({{ d['company_name'] }}){% endif %}</option>
            {% endfor %}
          </select>
        </div>
        <div class="form-group">
          <label>Assessment Title</label>
          <input type="text" name="title" class="form-control" placeholder="e.g. Python & SQL Screening Test" required>
        </div>
        <div class="form-group">
          <label>Time Limit (minutes)</label>
          <input type="number" name="time_limit" class="form-control" value="30" min="5" max="180">
        </div>
        <div class="form-group">
          <label>Passing Score (%)</label>
          <input type="number" name="passing_score" class="form-control" value="60" min="0" max="100">
        </div>
      </div>

      <hr class="div">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;">
        <p style="font-weight:700;color:#111827;font-size:0.95rem;">Questions</p>
        <button type="button" onclick="addQuestion()" class="btn btn-outline btn-sm"><i class="fa-solid fa-plus"></i> Add Question</button>
      </div>

      <div id="questions-container">
        <!-- Questions added dynamically -->
      </div>

      <div style="margin-top:20px;display:flex;gap:12px;">
        <button type="submit" class="btn btn-primary btn-lg"><i class="fa-solid fa-paper-plane"></i> Create Assessment</button>
        <a href="/company" class="btn btn-ghost btn-lg">Cancel</a>
      </div>
    </form>
  </div>
</div>
<script>
let qCount = 0;
function addQuestion() {
  const i = qCount++;
  const div = document.createElement('div');
  div.className = 'q-block';
  div.id = 'q-' + i;
  div.innerHTML = `
    <div style="display:flex;justify-content:space-between;margin-bottom:10px;">
      <span style="font-size:0.8rem;font-weight:700;color:#4f46e5;">Question ${i+1}</span>
      <button type="button" onclick="document.getElementById('q-${i}').remove()" style="background:none;border:none;cursor:pointer;color:#9ca3af;font-size:0.9rem;">✕</button>
    </div>
    <div class="form-group">
      <label>Question Text</label>
      <input type="text" name="q_text_${i}" class="form-control" placeholder="Enter question…" required>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      ${[0,1,2,3].map(j => `<input type="text" name="q_opt_${i}_${j}" class="form-control" placeholder="Option ${String.fromCharCode(65+j)}">`).join('')}
    </div>
    <div class="form-group">
      <label>Correct Answer (must match one option exactly)</label>
      <input type="text" name="q_ans_${i}" class="form-control" placeholder="Correct option text" required>
    </div>`;
  document.getElementById('questions-container').appendChild(div);
}
// Start with 3 questions
addQuestion(); addQuestion(); addQuestion();
</script>
{% endblock %}
